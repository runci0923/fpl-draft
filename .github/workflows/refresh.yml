name: Frissítés

# MIKOR FUT
# ---------
# A projekció lehúzása KÉZI lépés (az FPL Hub és a Solio bejelentkezést kér), tehát a
# gépnek csak két dolga lehet: lezárni egy fordulót, aminek elmúlt a deadline-ja, és
# beírni a valós pontokat, ha a forduló véget ért. Mindkettő ráér.
#
# Ezért: NAPI EGY futás, és az is egy kapun megy át (should_run.py). Ha nincs teendő,
# a job azonnal, munka nélkül, zölden zárul. Kézzel bármikor indítható — a `force`
# bemenettel a kapu megkerülhető (pl. friss projekció után újraépítéshez).
on:
  schedule:
    - cron: '0 6 * * *'          # naponta 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Kényszerített futás (friss projekció után is ezt használd)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Van-e teendő?
        id: gate
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
        run: python should_run.py

      - name: Adatok újrahúzása
        if: steps.gate.outputs.work == 'true'
        run: |
          python fetch_deadlines.py    # 38 forduló deadline-ja
          python build_idmap.py        # draft <-> fő FPL element_id
          python fetch_rankings.py     # 5 draft-rangsor (forrásonként hibatűrő)
          python fetch_league.py       # élő birtoklás: waiver/csere magától átjön
          python build.py
          python build_rosters.py      # diffelhető keret-napló
          python fetch_actuals.py
          python lock_gw.py            # lezárás, majd a valós pontok
          python build_history.py      # tipp vs valóság
          python build_h2h.py
          python publish_pages.py

      - name: Commit, ha változott
        if: steps.gate.outputs.work == 'true'
        run: |
          git config user.name "fpl-draft-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Frissítés: ${{ steps.gate.outputs.reason }}"
          git push

      - name: Összegzés
        run: echo "${{ steps.gate.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
