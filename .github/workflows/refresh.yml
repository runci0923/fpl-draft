name: Frissítés

# A rangsorok naponta, a projekciók fordulónként változnak. A snapshot-elv miatt
# sűrűbben futunk, mint amilyen sűrűn az adat változik: a deadline előtti utolsó
# futás lesz a kanonikus becslés.
on:
  schedule:
    # Óránként. A lezárás (lock_gw.py) idempotens: nem cron-pontosságra épül, hanem
    # arra, hogy „aminek elmúlt a deadline-ja és még nincs lezárva, azt zárd le".
    # Így egy kihagyott futás sem veszít adatot, csak késik.
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Adatok újrahúzása
        run: |
          python fetch_deadlines.py    # 38 forduló deadline-ja + waiver/trade időpontok
          python build_idmap.py
          python fetch_rankings.py
          python fetch_league.py       # az élő birtoklás: waiver/csere magától átjön
          python build.py
          python build_rosters.py      # diffelhető keret-napló a git-történethez
          # A projekciót SZÁNDÉKOSAN nem futtatjuk itt: az FPL Hub és a Solio egyaránt
          # bejelentkezést kér, tehát CI-ben nem gyűjthető. A committolt proj/ snapshot
          # a kanonikus; a fetch_projections.py itt csak letaposná. Kézzel frissül.
          python fetch_actuals.py      # deadline után: tényleges felállás + pontok
          python lock_gw.py            # tipp+felállás lezárása, majd a valós pontok
          python build_history.py      # tipp vs valóság + forrás-pontosság
          python build_h2h.py
          python publish_pages.py

      - name: Commit, ha változott
        run: |
          git config user.name "fpl-draft-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --quiet --cached || git commit -m "Frissítés: rangsorok, keretek, projekciók"
          git push
